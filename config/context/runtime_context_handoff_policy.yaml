schema_version: 1

mission_context_handoff:
  enabled: true
  consumer_bindings:
    - contract_types: [patch_request]
      purpose: patch_planning
  require_admitted_context_for_bound_consumers: true
  source_layer: attachments_artifacts
  source_type: artifact_record
  trust_level: cited
  candidate_priority: 8

compatibility:
  allow_legacy_rag_plan_resolution: true
  legacy_rag_plan_is_not_context_authority: true

storage:
  canonical_plan_store_path: data/runtime/context/kernel_plans
