schema_version: 1

secret_detection:
  enabled: true
  redact_output: true
  block_secret_files: true

filename_patterns:
  - ".env"
  - "*.pem"
  - "*.key"
  - "credentials.*"
  - "secrets.*"

content_patterns:
  - name: generic_api_key
    pattern: "(?i)(api[_-]?key|secret|token|password)\\s*[:=]\\s*['\\\"]?[^\\s'\\\"]+"
    replacement: "[REDACTED_SECRET]"
  - name: bearer_token
    pattern: "(?i)bearer\\s+[a-z0-9._\\-]+"
    replacement: "[REDACTED_BEARER_TOKEN]"
