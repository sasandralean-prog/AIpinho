block_reason_codes:
  - reason_code: workspace_unknown
    human_reason: Workspace nao registrado ou nao resolvido.
    safe_alternative: Escolha um workspace autorizado antes de executar a ferramenta.
    severity: warning
  - reason_code: workspace_forbidden
    human_reason: Workspace bloqueado pela politica.
    safe_alternative: Use um workspace target_mutable ou source_readonly permitido.
    severity: error
  - reason_code: workspace_protected
    human_reason: Workspace protegido nao permite esta operacao.
    safe_alternative: Solicite uma acao em workspace autorizado ou reduza o escopo para leitura.
    severity: error
  - reason_code: source_readonly_write_denied
    human_reason: "Escrita bloqueada: este workspace e somente leitura."
    safe_alternative: Gere artifact externo ou use um workspace target_mutable.
    severity: warning
  - reason_code: path_traversal_denied
    human_reason: Path bloqueado por tentativa de sair do workspace.
    safe_alternative: Use caminhos relativos dentro do workspace autorizado.
    severity: error
  - reason_code: capability_not_allowed
    human_reason: Capability nao permitida no modo atual.
    safe_alternative: Altere para modo governado apropriado ou solicite uma acao de menor risco.
    severity: warning
  - reason_code: tool_disabled
    human_reason: Ferramenta desabilitada.
    safe_alternative: Use uma ferramenta equivalente habilitada.
    severity: warning
  - reason_code: agent_not_allowed
    human_reason: Agente nao autorizado para esta ferramenta.
    safe_alternative: Delegue para um agente autorizado.
    severity: warning
  - reason_code: risk_too_high
    human_reason: Risco alto demais para execucao automatica.
    safe_alternative: Divida a acao em passos menores e validaveis.
    severity: error
  - reason_code: approval_required
    human_reason: Esta acao precisa de aprovacao humana.
    safe_alternative: Revise preview, risco e efeitos esperados antes de aprovar.
    severity: warning
  - reason_code: destructive_shell_blocked
    human_reason: Shell destrutivo bloqueado por padrao.
    safe_alternative: Use comando readonly/test/build ou solicite plano seguro.
    severity: error
  - reason_code: network_shell_blocked
    human_reason: Shell com rede bloqueado por padrao.
    safe_alternative: Use rotas governadas de download/upload ou peca aprovacao explicita em modo apropriado.
    severity: error
  - reason_code: git_write_blocked
    human_reason: Operacao git write bloqueada por padrao.
    safe_alternative: Gere patch/artifact e valide antes de qualquer acao git.
    severity: error
  - reason_code: process_control_blocked
    human_reason: Controle amplo de processos bloqueado.
    safe_alternative: Use o backend controlado por endpoints oficiais.
    severity: error
  - reason_code: unknown_shell_blocked
    human_reason: Categoria de shell desconhecida bloqueada.
    safe_alternative: Classifique o comando como readonly/test/build/package quando aplicavel.
    severity: error
  - reason_code: secret_access_blocked
    human_reason: Possivel acesso ou vazamento de segredo bloqueado.
    safe_alternative: Remova tokens/secrets do payload e use referencias seguras.
    severity: error
  - reason_code: policy_unclassified
    human_reason: Politica nao conseguiu classificar a acao com seguranca.
    safe_alternative: Especifique workspace, capability e efeito esperado.
    severity: warning
