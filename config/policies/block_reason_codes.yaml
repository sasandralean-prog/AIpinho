schema_version: 1
codes:
- code: sandbox_allowed_low_risk
  category: sandbox
  human_reason_template: Operacao permitida dentro do sandbox governado.
  technical_meaning: Sandbox operation stayed inside the governed local sandbox.
  safe_alternatives:
  - Continuar dentro do sandbox governado.
  severity: info
  regression_candidate_required: false
  mobile_normal_message: Operacao sandbox permitida.
  mobile_details_fields:
  - sandbox_workspace_id
  - sandbox_task_id
  - evidence_refs
- code: sandbox_shell_allowed
  category: sandbox
  human_reason_template: Shell seguro permitido dentro do sandbox governado.
  technical_meaning: Shell category is allowed and cwd is confined to sandbox.
  safe_alternatives:
  - Continuar com comandos readonly/test/build/package.
  severity: info
  regression_candidate_required: false
  mobile_normal_message: Shell sandbox permitido.
  mobile_details_fields:
  - command
  - category
  - evidence_refs
- code: sandbox_artifact_export_allowed
  category: sandbox
  human_reason_template: Exportacao de artifact permitida para conteudo do sandbox.
  technical_meaning: Sandbox artifact export passed policy and token-protected artifact lifecycle.
  safe_alternatives:
  - Baixar pelo endpoint autenticado.
  severity: info
  regression_candidate_required: false
  mobile_normal_message: Artifact sandbox pronto para download.
  mobile_details_fields:
  - artifact_id
  - download_endpoint
  - evidence_refs
- code: sandbox_validation_allowed
  category: sandbox
  human_reason_template: Validacao sandbox permitida.
  technical_meaning: Sandbox validation is read-only and evidence-producing.
  safe_alternatives:
  - Revisar checks e evidence refs.
  severity: info
  regression_candidate_required: false
  mobile_normal_message: Validacao sandbox permitida.
  mobile_details_fields:
  - validation_id
  - evidence_refs
- code: sandbox_cleanup_preview_allowed
  category: sandbox
  human_reason_template: Limpeza sandbox permitida apos preview.
  technical_meaning: Cleanup was previewed before apply.
  safe_alternatives:
  - Revisar preview antes de aplicar limpeza.
  severity: info
  regression_candidate_required: false
  mobile_normal_message: Limpeza sandbox governada.
  mobile_details_fields:
  - cleanup_preview_id
  - evidence_refs
- code: sandbox_escape_blocked
  category: sandbox
  human_reason_template: Operacao bloqueada porque sairia do sandbox governado.
  technical_meaning: Resolved path is outside the sandbox root or workspace root.
  safe_alternatives:
  - Use um caminho relativo dentro do sandbox.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Caminho bloqueado fora do sandbox.
  mobile_details_fields:
  - relative_path
  - evidence_refs
- code: sandbox_path_traversal_blocked
  category: sandbox
  human_reason_template: Operacao bloqueada por tentativa de path traversal.
  technical_meaning: Relative path contains traversal or absolute path markers.
  safe_alternatives:
  - Use um caminho relativo simples dentro do workspace sandbox.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Caminho com travessia bloqueado.
  mobile_details_fields:
  - relative_path
  - evidence_refs
- code: sandbox_symlink_escape_blocked
  category: sandbox
  human_reason_template: Symlink ou junction para fora do sandbox foi bloqueado.
  technical_meaning: Existing symlink resolves outside the sandbox root.
  safe_alternatives:
  - Copie o conteudo para dentro do sandbox antes de operar.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Link para fora do sandbox bloqueado.
  mobile_details_fields:
  - relative_path
  - evidence_refs
- code: sandbox_outside_write_blocked
  category: sandbox
  human_reason_template: Escrita fora do sandbox foi bloqueada.
  technical_meaning: Write target resolved outside sandbox root.
  safe_alternatives:
  - Gere artifact ou escreva em workspace sandbox.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Escrita fora do sandbox bloqueada.
  mobile_details_fields:
  - relative_path
  - evidence_refs
- code: sandbox_outside_delete_blocked
  category: sandbox
  human_reason_template: Delete fora do sandbox foi bloqueado.
  technical_meaning: Safe delete target resolved outside sandbox root.
  safe_alternatives:
  - Use delete-safe apenas em arquivos do sandbox.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Delete fora do sandbox bloqueado.
  mobile_details_fields:
  - relative_path
  - evidence_refs
- code: sandbox_network_blocked
  category: sandbox
  human_reason_template: Comando de rede bloqueado no sandbox.
  technical_meaning: Shell command matched network command denylist.
  safe_alternatives:
  - Baixe dependencias por processo aprovado fora da execucao sandbox.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Rede bloqueada no sandbox.
  mobile_details_fields:
  - command
  - evidence_refs
- code: sandbox_destructive_command_blocked
  category: sandbox
  human_reason_template: Comando destrutivo ou desconhecido bloqueado no sandbox.
  technical_meaning: Shell category/pattern is unsafe or unclassified.
  safe_alternatives:
  - Use comandos readonly/test/build/package classificados.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Comando bloqueado no sandbox.
  mobile_details_fields:
  - command
  - category
  - evidence_refs
- code: sandbox_secret_access_blocked
  category: sandbox
  human_reason_template: Acesso a segredo bloqueado no sandbox.
  technical_meaning: Secret access policy denied operation.
  safe_alternatives:
  - Use variaveis redigidas ou artifacts sanitizados.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Segredo bloqueado no sandbox.
  mobile_details_fields:
  - evidence_refs
- code: sandbox_artifact_too_large
  category: sandbox
  human_reason_template: Artifact sandbox excede o limite permitido.
  technical_meaning: Estimated artifact size is greater than sandbox artifact max bytes.
  safe_alternatives:
  - Exporte um subconjunto menor ou aumente policy explicitamente.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Artifact grande demais.
  mobile_details_fields:
  - size
  - evidence_refs
- code: sandbox_cleanup_requires_preview
  category: sandbox
  human_reason_template: Limpeza do sandbox exige preview antes de aplicar.
  technical_meaning: Cleanup apply was requested without preview id.
  safe_alternatives:
  - Execute cleanup preview e revise candidatos.
  severity: warning
  regression_candidate_required: true
  mobile_normal_message: Limpeza exige preview.
  mobile_details_fields:
  - cleanup_preview_id
  - evidence_refs
