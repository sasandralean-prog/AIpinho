version: 1
default_execution_mode: governed_autorun
enable_power_user_mode: true
enable_unrestricted_local_lab: false
autoapprove_low_risk: true
autoapprove_medium_risk: true
autoapprove_high_risk: false
block_critical_risk: true
autoapprove_system_write: false
system_mutable_write_policy:
  allow_operations:
    - workspace_readonly_audit_report
    - workspace_static_reachability_report
    - workspace_evidence_bundle
    - report_generate
  modes:
    - governed_autorun
    - power_user
  allowed_capabilities:
    - workspace_write
    - create_file
    - report_generate
require_reason_for_block: true
require_safe_alternative_on_block: true
audit_all_decisions: true
autoapproval_matrix:
  safe_chat:
    artifact_create: true
