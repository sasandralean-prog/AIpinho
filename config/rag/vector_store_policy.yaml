schema_version: 1

vector_store:
  enabled: true
  backend: local_json
  governed_root: data/vectorstores/governed
  require_namespace_directory: true
  require_manifest: true
  require_chunk_store: true
  require_embedding_store: true
  require_citation_store: true
  require_audit_store: true

allowed_write_paths:
  - data/vectorstores/governed/**
  - data/runtime/rag_ingestions/**
  - data/runtime/rag_queries/**
  - data/logs/**

blocked_write_paths:
  - data/vectorstores/legacy/**
  - rag_store/**
  - vectorstore/**
  - chroma/**
  - faiss/**
  - src/**
  - config/**
  - tests/**

rules:
  no_workspace_source_mutation: true
  no_unregistered_index_write: true
  no_secret_embedding: true
  no_uncited_chunk: true
