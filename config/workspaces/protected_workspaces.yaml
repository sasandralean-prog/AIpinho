schema_version: 1

protected_roots:
  - path: "C:\\Windows"
    label: "operating_system_root"
    block_read: true
    block_write: true
    block_task: true
    requires_governed_approval: false
    reason: "Operating system root is outside authorized AIpinho workspaces."

  - path: "C:\\Program Files"
    label: "system_program_files"
    block_read: true
    block_write: true
    block_task: true
    requires_governed_approval: false
    reason: "Program files root is outside authorized AIpinho workspaces."

  - path: "C:\\Program Files (x86)"
    label: "system_program_files_x86"
    block_read: true
    block_write: true
    block_task: true
    requires_governed_approval: false
    reason: "Program files root is outside authorized AIpinho workspaces."

  - path: "C:\\PinhoabacaxiAI"
    label: "explicitly_authorized_governed_workspace"
    block_read: false
    block_write: false
    block_task: false
    requires_governed_approval: true
    reason: "Authorized by local operator for governed approval-gated execution."
