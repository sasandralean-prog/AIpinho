  speaker_truth: AIpinho

trust_order:
  L0: 0
  L1: 1
  L2: 2
  L3: 3
  L4: 4

capability_categories:
  filesystem: [approve, deny]
  patch: [approve, deny]
  build: [approve, deny]
  shell: [approve, deny]
  runtime: [approve, deny]
  policy: [approve, deny]
  memory: [approve, deny]
  database: [approve, deny]
  security: [approve, deny]
