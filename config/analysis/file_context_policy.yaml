schema_version: 1
file_context:
  enabled: true
  max_files: 12
  max_total_bytes: 120000
  max_file_bytes: 30000
  max_context_chars_per_file: 30000
  blocked_extensions:
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .webp
    - .ico
    - .zip
    - .7z
    - .rar
    - .exe
    - .dll
    - .so
    - .dylib
    - .sqlite
    - .db
  blocked_names:
    - .env
    - .env.*
    - '*secret*'
    - '*token*'
    - '*credential*'
