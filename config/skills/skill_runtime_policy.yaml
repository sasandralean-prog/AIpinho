  skill_expands_contract: true
  skill_selects_model: true
  skill_builds_context: true
  skill_decides_final_status: true
maintenance:
  diagnose_read_only: true
  repair_preview_only: true
  real_execution: false
  patch_apply: false
  config_write: false
  memory_write: false
  shell: false
  git: false
