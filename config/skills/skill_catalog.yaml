schema_version: 1
skills:
  aipinho.context_explainer:
    namespace: aipinho
    category: context
    display_name: Aipinho Context Explainer
    purpose: Explain admitted context bundles, rejected items, citations and budget.
    when_to_use:
    - context
    - explanation
    - bundle
    - citation
    - budget
    when_not_to_use:
    - direct execution
    - credential handling
    - policy bypass
    input_contract:
      type: object
      required: []
      properties: {}
      additional_properties: false
    output_contract:
      type: object
      required:
      - summary
      properties:
        summary:
          type: string
      additional_properties: true
    required_context_purpose: skill_execution_future
    required_capabilities: []
    allowed_tools: []
    forbidden_tools: []
    risk_level: low
    approval_required: false
    supports_preview: true
    supports_dry_run: true
    supports_real_execution: false
    validation:
    - rule_id: output_contract
      description: Validate declared output contract.
      required: true
    fallback:
      mode: block
      target_skill_id: null
      human_message: Skill unavailable; no execution performed.
    anti_triggers:
    - signal: direct_execution_requested
      reason: direct_execution_blocked
    - signal: credential_required
      reason: credential_request_blocked
    examples:
    - label: preview
      input: {}
      expected_mode: preview
    failure_modes:
    - code: contract_denied
      behavior: block
      human_message: Skill blocked by contract.
    events_emitted:
    - skill_preview_created
    - skill_dry_run_completed
    debugger_trace_policy: sanitized
    status: enabled
    default_enabled: true
    execution_mode: read_only
