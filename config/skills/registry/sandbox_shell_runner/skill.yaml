skill_id: internal.sandbox_shell_runner
display_name: Sandbox Shell Runner
slug: sandbox_shell_runner
description: Run a classified safe shell command with cwd confined to a governed sandbox task.
version: 1.0.0
status: active
category: validation
owner: aipinho
compatible_agents: [aipinho, codex, gemini]
compatible_project_stacks: [android_gradle, python, node, mixed, unknown]
required_capabilities: [sandbox_shell]
allowed_tools: [sandbox_run_shell]
denied_tools: [run_shell, patch_apply]
input_schema:
  type: object
  properties:
    command: {type: string}
    cwd_relative: {type: string}
    category: {type: string}
output_schema: {type: object}
side_effects: [sandbox_shell]
workspace_policy: {source_readonly_write: false, outside_sandbox_write: false}
sandbox_required: true
sandbox_allowed: true
sandbox_side_effects: [safe_shell]
command_policy: {network: blocked, destructive: blocked, unknown: blocked}
artifact_policy: {enabled: false}
memory_policy: {mode: none}
validation_policy: {required: true, failure_policy: block_completion}
speaker_truth_policy: {raw_hidden_by_default: true, must_cite_evidence: true}
risk_level: medium
approval_policy: {required: false}
docs_ref: docs/sandbox/SANDBOX_SHELL_POLICY.md
tests_ref: tests/sandbox
