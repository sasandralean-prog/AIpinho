schema_version: 1
profile:
  id: project_generation
  operation_types: [project_generation, android_project_create, android_apk_build]
  allowed_step_types: [validate_runtime, validate_workspace, execute_project_generation, validate_project_result, compose_final_result]
  steps: [validate_runtime, validate_workspace, execute_project_generation, validate_project_result, compose_final_result]
  allowed_actions: [write_files, run_command, run_tests]
  allowed_side_effects: [filesystem_write, shell]
  required_capabilities: [write_workspace]
  approval_scope: project_write
  workspace_requirements: {required: true, allowed_roles: [target_mutable, system_mutable]}
  forbidden: [forbidden_root, source_readonly, path_traversal]
  max_duration_seconds: 600
  output_validation_required: true
  artifact_registration_required: true
  default_safe_to_execute_policy: policy_and_approval
