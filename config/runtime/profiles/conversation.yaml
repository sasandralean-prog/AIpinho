schema_version: 1
profile:
  id: conversation
  operation_types: [conversation]
  allowed_step_types: [validate_runtime, run_role_pipeline, compose_final_result]
  steps: [validate_runtime, run_role_pipeline, compose_final_result]
  allowed_side_effects: []
  required_capabilities: [model_inference]
  approval_scope: null
  workspace_requirements: {required: false, allowed_roles: []}
  max_duration_seconds: 90
  output_validation_required: true
  artifact_registration_required: false
  default_safe_to_execute_policy: policy_allowed
