  operation_types: [analysis_readonly, readonly_analysis, workspace_analysis_readonly, readonly_analysis_with_artifact_output, project_analysis, report_generation]
  allowed_step_types: [validate_runtime, validate_workspace, build_project_tree, build_file_context, run_project_analysis, generate_project_report, run_role_pipeline, compose_final_result]
  steps: [validate_runtime, validate_workspace, build_project_tree, build_file_context, run_project_analysis, generate_project_report, run_role_pipeline, compose_final_result]
