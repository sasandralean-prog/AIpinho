schema_version: 1

atomic_write:
  enabled: true
  use_temp_file: true
  temp_suffix: ".aipinho_tmp"
  temp_same_directory: true
  replace_existing_atomically: true
  cleanup_temp_on_success: true
  cleanup_temp_on_failure: true
  block_if_temp_exists: true

constraints:
  temp_file_counts_as_internal_write: true
  temp_file_must_share_allowed_target_dir: true
  temp_file_must_not_be_executable: true
