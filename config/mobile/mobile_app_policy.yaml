schema_version: 1
mobile_app:
  enabled: true
  platform: android
  mode: backend_client
  backend_is_source_of_truth: true
  sync_via_backend: true
  require_token_auth: true
  require_event_contracts: true
  require_degraded_states: true
  require_raw_hidden_by_default: true
  cyberpunk_neon_theme_enabled: true
  horizontal_tabs_enabled: true
  connection_autofill_enabled: true
  support_bundle_preview_enabled: true
  allow_upload: true
  allow_download: true
  allow_zip_download: true
  allow_restart_services: true
  allow_restart_ports: [9088, 9089, 9098]
  block_restart_ports: [9099]
blocked:
  hardcoded_token: true
  direct_launcher_sync: true
  arbitrary_command_execution: true
  shell_execution: true
  git_execution: true
  patch_apply: true
  model_auto_execution: true
  raw_token_display_default: true
  raw_prompt_display_default: true
  raw_output_display_default: true
  workspace_file_direct_download: true
  unknown_event_rendered_as_normal: true
