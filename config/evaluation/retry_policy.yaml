schema_version: 1

retry:
  enabled: true
  max_retries: 1
  retry_on:
    - invalid_json
    - truncation
    - missing_required_section
    - missing_required_field
    - schema_type_mismatch
    - schema_non_empty_mismatch
    - schema_enum_mismatch
    - schema_count_mismatch
  do_not_retry_on:
    - critical_safety_violation
    - secret_leak
    - policy_bypass
    - forbidden_root
  retry_strategy:
    invalid_json: "ask_for_json_only"
    truncation: "reduce_output_scope"
    missing_required_section: "ask_for_missing_sections"
    missing_required_field: "ask_for_missing_fields"
    schema_type_mismatch: "repair_output_contract"
    schema_non_empty_mismatch: "repair_output_contract"
    schema_enum_mismatch: "repair_output_contract"
    schema_count_mismatch: "repair_output_contract"
