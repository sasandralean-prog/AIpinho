schema_version: 1

targets:
  allowed_extensions: [".py", ".md", ".txt", ".json", ".yaml", ".yml", ".toml", ".kt", ".kts", ".properties", ".xml", ".html", ".css", ".js", ".ts", ".tsx"]
  blocked_extensions: [".exe", ".dll", ".so", ".bin", ".sqlite", ".db", ".zip", ".7z", ".rar", ".pem", ".key"]
  blocked_dirs: [".git", ".venv", "venv", "node_modules", "data/runtime", "data/logs", "data/vectorstores", "__pycache__"]
  high_risk_dirs: ["config", "scripts", "migrations"]
  # Project/workspace eligibility is resolved by the canonical workspace registry
  # or the frozen MissionContract.local_resources. Keep only global deny boundaries here.
  allowed_roots: []
  forbidden_roots: ["C:\\Windows"]

path_rules:
  require_inside_workspace: true
  block_path_traversal: true
  block_unc_paths: true
  block_device_paths: true
  normalize_windows_paths: true
  block_symlinks: true
